filter {
  if [message] =~ /^{.*}/ {
    json {
      source => "message"
      target => "logjson"
      skip_on_invalid_json => true
    }

    useragent {
      source => "[logjson][http_user_agent]"
      ecs_compatibility => "v8"
    }

    mutate {
      copy => {"[logjson][upstream_response_time]" => "upstream_response_time_float"}
      convert => {"upstream_response_time_float" => "float"}
    }

    # Extract message from mirror or from Sidekiq (e.g. "start")
    if [logjson][message] {
      mutate {
        rename => { "[logjson][message]" => "[logjson_message]" }
      }

      # Detect nested Sidekiq objects and extract to separate field
      if [logjson_message][queues] {
        mutate {
          rename => { "[logjson_message]" => "[logjson_sidekiq_object]" }
        }
      }

      # Some other Sidekiq logs (e.g. publishing-api "Unlocked") put a job object
      # in `message`. `logjson_message` is mapped as a keyword, so keep only the
      # inner message string there. The full job is still in the raw `message`.
      # (@metadata is never indexed.)
      if [logjson_message][message] or [logjson_message][jid] {
        mutate {
          rename => { "[logjson_message]" => "[@metadata][sidekiq_job]" }
        }
        mutate {
          copy => { "[@metadata][sidekiq_job][message]" => "[logjson_message]" }
        }
      }
    }

    # Fix email-alert-frontend errors landing in the dead letter queue
    if [logjson][status] and [logjson][status] =~ /[^0-9.-]/ {
      mutate {
        rename => { "[logjson][status]" => "[logjson][status_text]" }
      }
    }

    # controller-runtime apps (e.g. aws-load-balancer-controller) log `ts` as an
    # RFC3339 string, whereas zap apps (e.g. gatekeeper) log epoch seconds.
    # Keep `ts` numeric so the first log of the day can't set the wrong type.
    if [logjson][ts] and [logjson][ts] =~ /[^0-9.eE+-]/ {
      mutate {
        rename => { "[logjson][ts]" => "[logjson][ts_text]" }
      }
    }

    # Go duration strings (e.g. gatekeeper "1.518508839s") vs numeric durations
    if [logjson][duration] and [logjson][duration] =~ /[^0-9.eE+-]/ {
      mutate {
        rename => { "[logjson][duration]" => "[logjson][duration_text]" }
      }
    }
  }

  # If error is a string and not an object (fixes mirror?)
  if [error] and ![error][message] and ![error][type] {
    mutate {
      rename => { "error" => "error_message" }
    }
  }
}
