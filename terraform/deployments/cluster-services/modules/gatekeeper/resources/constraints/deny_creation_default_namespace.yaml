apiVersion: constraints.gatekeeper.sh/v1beta1
kind: DenyCreationDefaultNamespace
metadata:
  name: denycreationdefaultnamespace
spec:
  match:
    scope: "Namespaced"
    namespaces: ["default"]
  parameters:
    denyForGroups: [ "platformengineer", "fulladmin", "tempadmin", "developer", "licensinguser", "ithctester", "readonly", "dguengineer" ]