apiVersion: templates.gatekeeper.sh/v1
kind: ConstraintTemplate
metadata:
  name: denycreationdefaultnamespace
  annotations:
    metadata.gatekeeper.sh/title: Deny creation of objects in the default namespace
    description: This constraint ensures that no objects are created in the default namespace
spec:
  crd:
    spec:
      names:
        kind: denycreationdefaultnamespace

  targets:
    - target: admission.k8s.gatekeeper.sh
      code:
        - engine: Rego
          source:
            version: "v1"
            rego: |
              package denycreationdefaultnamespace

              # API server has to be able to create the kubernetes service
              is_exempt if {
                input.review.kind.kind == "Service"
                input.review.name == "kubernetes"
              }

              # EKS has to be able to create the CA in a ConfigMap
              is_exempt if {
                input.review.kind.kind == "ConfigMap"
                input.review.name == "kube-root-ca.crt"
              }

              violation contains {"msg": msg} if {

                not is_exempt

                input.review.namespace == "default"

                msg := sprintf("(%s) is not allowed to be created, modified or deleted on in the default namespace", [input.review.name])
              }