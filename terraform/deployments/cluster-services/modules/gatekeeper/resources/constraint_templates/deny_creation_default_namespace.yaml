apiVersion: templates.gatekeeper.sh/v1
kind: ConstraintTemplate
metadata:
  name: denycreationdefaultnamespace
  annotations:
    metadata.gatekeeper.sh/title: Deny creation of objects in the default namespace
    description: This constraint ensures that no objects are created in the default namespace
spec:
  crd:
    spec:
      names:
        kind: denycreationdefaultnamespace

  targets:
    - target: admission.k8s.gatekeeper.sh
      code:
        - engine: Rego
          source:
            version: "v1"
            rego: |
              package denycreationdefaultnamespace

              violation contains {"msg": msg} if {
                input.review.namespace == "default"
                username := input.review.userInfo.username
                group := input.review.userInfo.groups

                msg := sprintf("Resource %s cannot be created, modified, or deleted by %s of group %s in the default namespace", [input.review.name, username, group])
              }