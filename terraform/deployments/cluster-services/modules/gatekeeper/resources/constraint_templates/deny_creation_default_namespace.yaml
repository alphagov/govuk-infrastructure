apiVersion: templates.gatekeeper.sh/v1
kind: ConstraintTemplate
metadata:
  name: denycreationdefaultnamespace
  annotations:
    metadata.gatekeeper.sh/title: Deny creation of objects in the default namespace
    description: This constraint ensures that no objects are created in the default namespace
spec:
  crd:
    spec:
      names:
        kind: DenyCreationDefaultNamespace
      validation:
        openAPIV3Schema:
          type: object
          properties:
            denyForGroups:
              description: Groups that the policy will not allow to create in the default namespace.
              type: array
              items:
                type: string

  targets:
    - target: admission.k8s.gatekeeper.sh
      code:
        - engine: Rego
          source:
            version: "v1"
            rego: |
              package denycreationdefaultnamespace
              
              isUserInGroup(userInfo, excludedGroups) if {
                userGroups := object.get(userInfo, "groups", [])
                groups := {g | g := userGroups[_]}
                excluded := {g | g := excludedGroups[_]}
                intersection := groups & excluded
                count(intersection) > 0
              }

              violation contains {"msg": msg} if {
                input.review.namespace == "default"
                username := input.review.userInfo.username
                group := input.review.userInfo.groups
                params := object.get(input, "parameters", {})
                excludedGroups := object.get(params, "denyForGroups", [])

                # Disallow if user belongs to an excluded group
                isUserInGroup(input.review.userInfo, excludedGroups)

                msg := sprintf("Resource %s cannot be created, modified, or deleted by %s of group %s in the default namespace", [input.review.name, username, group])
              }