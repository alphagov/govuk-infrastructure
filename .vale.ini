MinAlertLevel = suggestion
StylesPath = .vale/styles/

Packages = RedHat

Vocab = PlatformEngineering

SkippedScopes = blockquote

[*.md]
BasedOnStyles = Vale, RedHat, GOVUK, PlatformEngineering
RedHat.Definitions = NO # We override this in the GOV.UK style
RedHat.Contractions = NO # GOV.UK style is to not use contractions: https://www.gov.uk/guidance/style-guide/a-to-z#contractions
RedHat.GitLinks = NO # RedHat style says not to link to GitHub. We use GitHub.
RedHat.ReadabilityGrade = NO # This is a measure of the complexity of the language we use. We probably aren't ready to deal with that just yet.
RedHat.Spelling = NO # We want to rely on our own spelling rules
RedHat.TermsErrors = NO # TermsErrors enforces some American spellings, and the other things in the list aren't so important to us
RedHat.NoGerundsInTitles = NO # 2026-07-14 v663 introduced this rule and it's broken
RedHat.Spacing = NO # The rule enforces a single space between words, but hits a false positive on GOV.UK which can't be overridden in our vocab files
Vale.Spelling = NO # We want to rely on our own spelling rules