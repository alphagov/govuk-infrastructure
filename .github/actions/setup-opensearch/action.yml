name: 'Setup OpenSearch'
description: 'Create a new OpenSearch instance'

runs:
  using: "composite"
  steps:
    - name: Configure sysctl limits
      shell: bash
      run: |
        sudo swapoff -a
        sudo sysctl -w vm.swappiness=1
        sudo sysctl -w fs.file-max=262144
        sudo sysctl -w vm.max_map_count=262144

    - name: Create network
      shell: bash
      run: docker network create opensearch

    - name: Start container
      env:
        OPENSEARCH_IMAGE_TAG: 3.7.0
        OPENSEARCH_PORT: 9200
      shell: bash
      run: |
        docker run --name="opensearch" \
         --rm --detach \
         --env "discovery.type=single-node" \
         --env "bootstrap.memory_lock=true" \
         --env "OPENSEARCH_JAVA_OPTS=-Xms1g -Xmx1g" \
         --env "DISABLE_INSTALL_DEMO_CONFIG=true" \
         --env "DISABLE_SECURITY_PLUGIN=true" \
         --ulimit "nofile=65536:65536" \
         --ulimit "memlock=-1:-1" \
         --publish "${OPENSEARCH_PORT}:9200" \
         --network "opensearch" \
         opensearchproject/opensearch:${OPENSEARCH_IMAGE_TAG}

        for i in {1..30}; do
          if curl --silent --fail http://localhost:${OPENSEARCH_PORT}/ >/dev/null; then
            break
          fi
          sleep 2
        done