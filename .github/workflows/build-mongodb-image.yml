name: Build and push MongoDB image to ECR

on:
  workflow_dispatch:
    inputs:
      gitRef:
        description: 'Commit, tag or branch name to deploy'
        required: true
        type: string
        default: main

  push:
    branches:
      - main
    paths:
      - images/mongodb/Dockerfile

  schedule:
    - cron: '28 3 * * 1'

jobs:
  build-and-push-image:
    uses: alphagov/govuk-infrastructure/.github/workflows/build-push-arm-image.yml@3a97c204e07d33a72955f4e73cb3f913a0943174 # main
    with:
      gitRef: ${{ inputs.gitRef || github.ref }}
      imageName: mongodb
      dockerfilePath: images/mongodb/Dockerfile
    permissions:
      id-token: write
      contents: read
      packages: write
