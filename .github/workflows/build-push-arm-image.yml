name: Build and push ARM image
run-name: >-
  Build and push ARM image: ${{ inputs.imageName || github.event.repository.name }} @
  ${{ inputs.gitRef || github.sha }}

on:
  workflow_call:
    inputs:
      imageName:
        description: 'Image name appended to ghcr.io/<owner>/govuk/. Defaults to repository name.'
        required: false
        type: string
        default: ${{ github.event.repository.name }}
      dockerfilePath:
        description: 'Path to Dockerfile used for build.'
        required: false
        type: string
        default: Dockerfile
      context:
        description: 'Docker build context path.'
        required: false
        type: string
        default: .
      buildArgs:
        description: 'Optional newline-delimited Docker build arguments.'
        required: false
        type: string
      target:
        description: 'Optional Docker target stage to build.'
        required: false
        type: string
      gitRef:
        description: 'Git ref, tag, or SHA to checkout before building.'
        required: false
        type: string
        default: ${{ github.sha }}
      runnerName:
        description: 'Runner label used for native ARM64 build.'
        required: false
        type: string
        default: ubuntu-24.04-arm
      additionalTags:
        description: 'Optional extra docker/metadata-action tag rules, one per line.'
        required: false
        type: string
      generateProvenance:
        description: 'Generate OCI provenance attestation during image build.'
        required: false
        type: boolean
        default: true
      generateSbom:
        description: 'Generate OCI SBOM attestation during image build.'
        required: false
        type: boolean
        default: true
      signImage:
        description: 'Sign pushed image digest and attached attestations with Cosign using GitHub OIDC.'
        required: false
        type: boolean
        default: true
      writeSummary:
        description: 'Write image details to GitHub step summary.'
        required: false
        type: boolean
        default: true
    secrets:
      BUILD_SECRETS:
        description: "Allows adding secrets to the docker build task - https://docs.docker.com/build/ci/github-actions/secrets"
        required: false
    outputs:
      imageTag:
        description: 'Primary image tag generated by docker/metadata-action.'
        value: ${{ jobs.build-and-push-arm-image.outputs.imageTag }}
      imageDigest:
        description: 'Digest of pushed ARM image.'
        value: ${{ jobs.build-and-push-arm-image.outputs.imageDigest }}
      imageRef:
        description: 'Fully qualified image reference for primary tag.'
        value: ${{ jobs.build-and-push-arm-image.outputs.imageRef }}

concurrency:
  group: build-push-arm-image-${{ github.repository }}-${{ inputs.imageName || github.event.repository.name }}-${{ inputs.gitRef || github.sha }}
  cancel-in-progress: true

jobs:
  build-and-push-arm-image:
    name: Build and push ARM image for ${{ inputs.imageName }}
    runs-on: ${{ inputs.runnerName }}
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      packages: write
    outputs:
      imageTag: ${{ steps.meta.outputs.version }}
      imageDigest: ${{ steps.build-image.outputs.digest }}
      imageRef: ${{ steps.image-ref.outputs.value }}
    env:
      IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/govuk/${{ inputs.imageName }}
      IMAGE_PLATFORM: linux/arm64
    steps:
      - uses: docker/setup-docker-action@77e84dbf09b47d1e29270283c22f16145aa85ca1 # v5.4.0
        with:
          version: version=29.7.1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.gitRef }}
          fetch-depth: 1
          show-progress: false

      - name: Login to container registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        with:
          platforms: ${{ env.IMAGE_PLATFORM }}

      - name: Resolve checked out SHA
        id: local-head
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            ${{ env.IMAGE_NAME }}
          labels: |
            org.opencontainers.image.description=Container image for ${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.local-head.outputs.sha }}
            org.opencontainers.image.title=${{ inputs.imageName }}
            org.opencontainers.image.vendor=GDS
          annotations: |
            org.opencontainers.image.authors=Government Digital Service
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable=${{ inputs.gitRef == github.event.repository.default_branch || inputs.gitRef == format('refs/heads/{0}', github.event.repository.default_branch) }}
            type=raw,priority=500,value=${{ inputs.gitRef }},enable=${{ startsWith(inputs.gitRef, 'v') }}
            type=raw,priority=400,value=${{ steps.local-head.outputs.sha }},enable=${{ !startsWith(inputs.gitRef, 'v') }}
            ${{ inputs.additionalTags }}

      - name: Build and push ARM image
        id: build-image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfilePath }}
          target: ${{ inputs.target }}
          build-args: ${{ inputs.buildArgs }}
          secrets: ${{ secrets.BUILD_SECRETS }}
          pull: true
          push: true
          platforms: ${{ env.IMAGE_PLATFORM }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha,scope=${{ inputs.imageName }}-arm64
          cache-to: type=gha,mode=max,scope=${{ inputs.imageName }}-arm64
          provenance: ${{ inputs.generateProvenance }}
          sbom: ${{ inputs.generateSbom }}

      - name: Capture primary image reference
        id: image-ref
        run: echo "value=${IMAGE_NAME}:${{ steps.meta.outputs.version }}" >> "$GITHUB_OUTPUT"

      - name: Install Cosign
        if: ${{ inputs.signImage }}
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6

      - name: Sign image
        if: ${{ inputs.signImage }}
        env:
          DIGEST: ${{ steps.build-image.outputs.digest }}
        run: |
          cosign sign --recursive --yes "${IMAGE_NAME}@${DIGEST}"

      - name: Write build summary
        if: ${{ inputs.writeSummary }}
        env:
          DIGEST: ${{ steps.build-image.outputs.digest }}
          IMAGE_TAG: ${{ steps.meta.outputs.version }}
        run: |
          {
            echo '### Docker image build'
            echo
            echo "- Image: \`${IMAGE_NAME}\`"
            echo "- Tag: \`${IMAGE_TAG}\`"
            echo "- Digest: \`${DIGEST}\`"
            echo "- Platform: \`${IMAGE_PLATFORM}\`"
            echo "- Git ref: \`${{ inputs.gitRef }}\`"
            echo "- Signed with Cosign: \`${{ inputs.signImage }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
